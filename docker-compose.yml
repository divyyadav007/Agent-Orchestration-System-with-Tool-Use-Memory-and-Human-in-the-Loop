version: '3.8'

services:
  streamlit-ui:
    build: .
    container_name: agent_orchestrator_ui
    ports:
      - "8501:7860"
    volumes:
      - .:/app
      - chroma_data:/app/chroma_data
    env_file:
      - .env
    environment:
      - CHROMA_DB_PATH=/app/chroma_data
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: agent_orchestrator_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  chroma_data:
